<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fafafa 0%, #f5f5f7 100%);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 680px;
            width: 100%;
            text-align: center;
        }

        .quote-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 56px 48px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06),
                        0 1px 2px rgba(0, 0, 0, 0.04);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .quote-card:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08),
                        0 2px 4px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        .quote-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 32px;
            opacity: 0.12;
        }

        .quote-text {
            font-size: 28px;
            font-weight: 500;
            line-height: 1.45;
            color: #1d1d1f;
            letter-spacing: -0.022em;
            margin-bottom: 24px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .quote-text.loading {
            opacity: 0.4;
        }

        .quote-author {
            font-size: 17px;
            font-weight: 600;
            color: #86868b;
            letter-spacing: -0.01em;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .quote-author.loading {
            opacity: 0.4;
        }

        .refresh-btn {
            margin-top: 40px;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 500;
            color: #ffffff;
            background: #0071e3;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        .refresh-btn:disabled {
            background: #86868b;
            cursor: not-allowed;
            transform: none;
        }

        .refresh-icon {
            width: 18px;
            height: 18px;
            transition: transform 0.5s ease;
        }

        .refresh-btn:not(:disabled):hover .refresh-icon {
            transform: rotate(180deg);
        }

        .error-message {
            color: #ff3b30;
            font-size: 15px;
            margin-top: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.visible {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .quote-card {
                padding: 40px 28px;
                border-radius: 16px;
            }

            .quote-text {
                font-size: 22px;
                min-height: 100px;
            }

            .quote-author {
                font-size: 15px;
            }

            .refresh-btn {
                padding: 14px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote-card">
            <svg class="quote-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.5 10c-.223 0-.437.034-.65.065.069-.232.14-.468.254-.68.114-.308.292-.575.469-.844.148-.291.409-.488.601-.737.201-.242.475-.403.692-.604.213-.21.492-.315.714-.463.232-.133.434-.28.65-.35l.539-.222.474-.197-.485-1.938-.597.144c-.191.048-.424.104-.689.171-.271.05-.56.187-.882.312-.318.142-.686.238-1.028.466-.344.218-.741.4-1.091.692-.339.301-.748.562-1.05.945-.33.358-.656.734-.909 1.162-.293.408-.492.856-.702 1.299-.19.443-.343.896-.468 1.336-.237.882-.343 1.72-.384 2.437-.034.718-.014 1.315.028 1.747.015.204.043.402.063.539l.025.168.026-.006A4.5 4.5 0 1 0 6.5 10zm11 0c-.223 0-.437.034-.65.065.069-.232.14-.468.254-.68.114-.308.292-.575.469-.844.148-.291.409-.488.601-.737.201-.242.475-.403.692-.604.213-.21.492-.315.714-.463.232-.133.434-.28.65-.35l.539-.222.474-.197-.485-1.938-.597.144c-.191.048-.424.104-.689.171-.271.05-.56.187-.882.312-.317.143-.686.238-1.028.467-.344.218-.741.4-1.091.692-.339.301-.748.562-1.05.944-.33.358-.656.734-.909 1.162-.293.408-.492.856-.702 1.299-.19.443-.343.896-.468 1.336-.237.882-.343 1.72-.384 2.437-.034.718-.014 1.315.028 1.747.015.204.043.402.063.539l.025.168.026-.006A4.5 4.5 0 1 0 17.5 10z"/>
            </svg>
            
            <p class="quote-text" id="quoteText">Loading inspiration...</p>
            <p class="quote-author" id="quoteAuthor">—</p>
            
            <button class="refresh-btn" id="refreshBtn" onclick="fetchQuote()">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                New Quote
            </button>
            
            <p class="error-message" id="errorMessage">Unable to fetch quote. Please try again.</p>
        </div>
    </div>

    <script>
        const quoteText = document.getElementById('quoteText');
        const quoteAuthor = document.getElementById('quoteAuthor');
        const refreshBtn = document.getElementById('refreshBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Backup quotes in case API fails
        const backupQuotes = [
            { q: "The only way to do great work is to love what you do.", a: "Steve Jobs" },
            { q: "Innovation distinguishes between a leader and a follower.", a: "Steve Jobs" },
            { q: "Stay hungry, stay foolish.", a: "Steve Jobs" },
            { q: "Design is not just what it looks like and feels like. Design is how it works.", a: "Steve Jobs" },
            { q: "Simplicity is the ultimate sophistication.", a: "Leonardo da Vinci" },
            { q: "The best time to plant a tree was 20 years ago. The second best time is now.", a: "Chinese Proverb" },
            { q: "Think different.", a: "Apple Inc." }
        ];

        async function fetchQuote() {
            // Set loading state
            quoteText.classList.add('loading');
            quoteAuthor.classList.add('loading');
            refreshBtn.disabled = true;
            errorMessage.classList.remove('visible');

            try {
                // Using DummyJSON API - has proper CORS headers
                const response = await fetch('https://dummyjson.com/quotes/random');
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Validate the response
                if (data && data.quote && data.author) {
                    displayQuote(data.quote, data.author);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error fetching quote:', error);
                // Use backup quote on error
                const randomBackup = backupQuotes[Math.floor(Math.random() * backupQuotes.length)];
                displayQuote(randomBackup.q, randomBackup.a);
            }
        }

        function displayQuote(text, author) {
            // Animate out
            quoteText.style.opacity = '0';
            quoteAuthor.style.opacity = '0';

            setTimeout(() => {
                // Update content
                quoteText.textContent = `"${text.trim()}"`;
                quoteAuthor.textContent = `— ${author}`;
                
                // Animate in
                quoteText.classList.remove('loading');
                quoteAuthor.classList.remove('loading');
                quoteText.style.opacity = '1';
                quoteAuthor.style.opacity = '1';
                refreshBtn.disabled = false;
            }, 200);
        }

        // Fetch initial quote on page load
        fetchQuote();
    </script>
</body>
</html>
